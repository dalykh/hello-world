name: Backend CI

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install dependencies
      run: npm ci
    - name: Run linters
      run: echo "Assuming 'npm run lint' is configured" # Replace with actual lint command
    - name: Run tests
      run: echo "Assuming 'npm test' is configured" # Replace with actual test command
